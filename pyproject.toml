[project]
name = "desafio-hostinger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
    "pymysql>=1.1.1",
    "aiomysql>=0.2.0",
    "python-dotenv>=1.0.1",
    "fastapi",
    "uvicorn[standard]",
    "bcrypt",
    "pyjwt",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.pyright]
pythonVersion = "3.14"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: isolated tests that do not require external services",
    "integration: tests that require the disposable MySQL test database",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
