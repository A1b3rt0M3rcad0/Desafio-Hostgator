# Docker Compose automatically loads variables from the root .env file.
# First local startup:
#   cp .env.example .env
#   docker compose up --build
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}"
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    environment:
      MYSQL_URL_CONNECTION_MIGRATIONS: "${MYSQL_URL_CONNECTION_MIGRATIONS:?Set MYSQL_URL_CONNECTION_MIGRATIONS in .env}"
      DB_WAIT_TIMEOUT_SECONDS: "${DB_WAIT_TIMEOUT_SECONDS:-90}"
      DB_WAIT_INTERVAL_SECONDS: "${DB_WAIT_INTERVAL_SECONDS:-2}"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      MYSQL_URL_CONNECTION_API: "${MYSQL_URL_CONNECTION_API:?Set MYSQL_URL_CONNECTION_API in .env}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_ISSUER: "${JWT_ISSUER:-desafio-hostgator-api}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-desafio-hostgator-web}"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}"
      REFRESH_TOKEN_PEPPER: "${REFRESH_TOKEN_PEPPER:?Set REFRESH_TOKEN_PEPPER in .env}"
      REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE_DAYS:-7}"
      CSRF_SECRET_KEY: "${CSRF_SECRET_KEY:?Set CSRF_SECRET_KEY in .env}"
      CSRF_HEADER_NAME: "${CSRF_HEADER_NAME:-X-CSRF-Token}"
      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      AUTH_COOKIE_SAMESITE: "${AUTH_COOKIE_SAMESITE:-lax}"
      AUTH_COOKIE_DOMAIN: "${AUTH_COOKIE_DOMAIN:-}"
      AUTH_ACCESS_COOKIE_NAME: "${AUTH_ACCESS_COOKIE_NAME:-access_token}"
      AUTH_REFRESH_COOKIE_NAME: "${AUTH_REFRESH_COOKIE_NAME:-refresh_token}"
      AUTH_CSRF_COOKIE_NAME: "${AUTH_CSRF_COOKIE_NAME:-csrf_token}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      TRUSTED_ORIGINS: "${TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      MYSQL_URL_CONNECTION_WORKER: "${MYSQL_URL_CONNECTION_WORKER:?Set MYSQL_URL_CONNECTION_WORKER in .env}"
      WORKER_SOURCE_PATH: "${WORKER_SOURCE_PATH:-/data/tickets.json}"
      WORKER_BATCH_SIZE: "${WORKER_BATCH_SIZE:-25}"
      WORKER_INTERVAL_SECONDS: "${WORKER_INTERVAL_SECONDS:-30}"
      WORKER_CONTROL_POLL_SECONDS: "${WORKER_CONTROL_POLL_SECONDS:-2}"
    volumes:
      - ./data:/data:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      WEB_APP_NAME: "${WEB_APP_NAME:-HostGator Analytics}"
      WEB_APP_ENV: "${WEB_APP_ENV:-development}"
      WEB_PUBLIC_URL: "${WEB_PUBLIC_URL:-http://localhost:5173}"
      WEB_API_URL: "${WEB_API_URL:-/api}"
      WEB_API_UPSTREAM_URL: "${WEB_API_UPSTREAM_URL:-http://api:8000}"
      WEB_SERVER_NAME: "${WEB_SERVER_NAME:-_}"
      WEB_REQUEST_TIMEOUT_MS: "${WEB_REQUEST_TIMEOUT_MS:-15000}"
      WEB_REGISTRATION_ENABLED: "${WEB_REGISTRATION_ENABLED:-true}"
      WEB_CSRF_COOKIE_NAME: "${WEB_CSRF_COOKIE_NAME:-csrf_token}"
      WEB_CSRF_HEADER_NAME: "${WEB_CSRF_HEADER_NAME:-X-CSRF-Token}"
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  db_data:
