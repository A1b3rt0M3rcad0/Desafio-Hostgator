# Docker Compose automatically loads variables from .env in this directory.
# First local test:
#   cp .env.example .env
#   docker compose up --build --wait --wait-timeout 120
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    environment:
      MYSQL_URL_CONNECTION_MIGRATIONS: "${MYSQL_URL_CONNECTION_MIGRATIONS:?Set MYSQL_URL_CONNECTION_MIGRATIONS in .env}"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      MYSQL_URL_CONNECTION_API: "${MYSQL_URL_CONNECTION_API:?Set MYSQL_URL_CONNECTION_API in .env}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_ISSUER: "${JWT_ISSUER:-desafio-hostgator-api}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-desafio-hostgator-web}"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}"
      REFRESH_TOKEN_PEPPER: "${REFRESH_TOKEN_PEPPER:?Set REFRESH_TOKEN_PEPPER in .env}"
      REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE_DAYS:-7}"
      CSRF_SECRET_KEY: "${CSRF_SECRET_KEY:?Set CSRF_SECRET_KEY in .env}"
      CSRF_HEADER_NAME: "${CSRF_HEADER_NAME:-X-CSRF-Token}"
      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      AUTH_COOKIE_SAMESITE: "${AUTH_COOKIE_SAMESITE:-lax}"
      AUTH_COOKIE_DOMAIN: "${AUTH_COOKIE_DOMAIN:-}"
      AUTH_ACCESS_COOKIE_NAME: "${AUTH_ACCESS_COOKIE_NAME:-access_token}"
      AUTH_REFRESH_COOKIE_NAME: "${AUTH_REFRESH_COOKIE_NAME:-refresh_token}"
      AUTH_CSRF_COOKIE_NAME: "${AUTH_CSRF_COOKIE_NAME:-csrf_token}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173}"
      TRUSTED_ORIGINS: "${TRUSTED_ORIGINS:-http://localhost:5173}"
    ports:
      - "8000:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
