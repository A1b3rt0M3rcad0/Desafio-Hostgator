name: Apply ingestion refactor

on:
  push:
    branches:
      - refactor/monitored-customer-batch-ingestion
    paths:
      - apply_ingestion_refactor.py
      - fix_generated_repository.py
      - .github/workflows/apply-ingestion-refactor.yml
  pull_request:
    branches:
      - master
    paths:
      - apply_ingestion_refactor.py
      - fix_generated_repository.py
      - .github/workflows/apply-ingestion-refactor.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/monitored-customer-batch-ingestion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply architectural refactor
        run: |
          python apply_ingestion_refactor.py
          python fix_generated_repository.py
      - name: Install project and validation tools
        run: |
          python -m pip install -e . pytest
          npm install --global pyright
      - name: Compile
        run: python -m compileall -q src tests
      - name: Typecheck
        run: pyright src tests
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/application/use_cases
      - name: Frontend build
        working-directory: web
        run: |
          npm install
          npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: align ingestion with monitored customers" || exit 0
          git push origin HEAD:refactor/monitored-customer-batch-ingestion
