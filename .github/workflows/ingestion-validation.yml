name: Ingestion validation

on:
  pull_request:
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "migrations/**/*.py"
      - "data/tickets.json"
      - "web/**"
      - "docker-compose.yaml"
      - ".github/workflows/ingestion-validation.yml"
  push:
    branches:
      - refactor/monitored-customer-batch-ingestion
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "migrations/**/*.py"
      - "data/tickets.json"
      - "web/**"
      - "docker-compose.yaml"
      - ".github/workflows/ingestion-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend
        run: python -m pip install -e . pytest
      - name: Install Pyright
        run: npm install --global pyright
      - name: Compile backend and migrations
        run: python -m compileall -q src tests migrations
      - name: Typecheck
        run: pyright src tests
      - name: Application use-case tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/application/use_cases
      - name: Validate static ticket source
        run: python -c "from pathlib import Path; from src.infra.workers.ticket_ingestion_worker import read_ticket_source; records = read_ticket_source(Path('data/tickets.json')); assert records"
      - name: Frontend build
        working-directory: web
        run: |
          npm install
          npm run build
