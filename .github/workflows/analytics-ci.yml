name: Finalize 2026 fixture

on:
  push:
    branches:
      - agent/infrastructure-ticket-ingestion-worker

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/infrastructure-ticket-ingestion-worker
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Generate the 2026 fixture
        run: python data/generate_tickets_mock.py

      - name: Remove the legacy mock directory
        run: rm -rf mock

      - name: Commit generated data and layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate 2026 ticket fixture in data"
          git push origin HEAD:agent/infrastructure-ticket-ingestion-worker
