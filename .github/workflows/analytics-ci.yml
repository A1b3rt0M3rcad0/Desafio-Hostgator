name: Analytics CI

on:
  push:
    branches:
      - feat/dashboard-reports-analytics
  pull_request:
    branches:
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: test_database
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PYTHONPATH: .
      MYSQL_URL_CONNECTION_API: mysql+aiomysql://root:test-password@127.0.0.1:3306/test_database
      JWT_SECRET_KEY: test-jwt-secret-key-with-at-least-32-bytes
      JWT_ALGORITHM: HS256
      JWT_ISSUER: desafio-hostgator-api
      JWT_AUDIENCE: desafio-hostgator-web
      REFRESH_TOKEN_PEPPER: test-refresh-token-pepper-with-at-least-32-bytes
      CSRF_SECRET_KEY: test-csrf-secret-key-with-at-least-32-bytes
      AUTH_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      TRUSTED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --dev
      - run: uv run python -m compileall -q src tests
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
