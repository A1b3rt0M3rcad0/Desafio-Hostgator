name: Apply Pyright fixes

on:
  push:
    branches:
      - refactor/analytics-use-case-repositories
    paths:
      - scripts/apply_pyright_fixes.py
      - .github/workflows/apply-pyright-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/analytics-use-case-repositories
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Apply deterministic fixes
        run: python scripts/apply_pyright_fixes.py
      - name: Remove one-shot automation
        run: |
          rm scripts/apply_pyright_fixes.py
          rm .github/workflows/apply-pyright-fixes.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: clear repository type errors"
          git push origin HEAD:refactor/analytics-use-case-repositories
