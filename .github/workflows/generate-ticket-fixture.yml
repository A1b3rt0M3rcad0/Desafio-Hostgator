name: Generate ticket fixture

on:
  push:
    branches:
      - agent/infrastructure-ticket-ingestion-worker
    paths:
      - data/generate_tickets_mock.py
      - mock/generate_tickets_mock.py
      - .github/workflows/generate-ticket-fixture.yml

permissions:
  contents: write

concurrency:
  group: generate-ticket-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/infrastructure-ticket-ingestion-worker
          fetch-depth: 0

      - name: Generate deterministic August 2026 fixture
        run: python data/generate_tickets_mock.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('data/tickets.json')
          tickets = json.loads(path.read_text(encoding='utf-8'))
          assert len(tickets) == 10_000
          assert len({item['ticket_id'] for item in tickets}) == 10_000
          assert len({item['requester_email'] for item in tickets}) == 500

          anchor = datetime.fromisoformat('2026-08-01T05:30:00+00:00')
          for ticket in tickets:
              for key in ('created_at', 'updated_at', 'first_response_at'):
                  value = ticket.get(key)
                  if value:
                      parsed = datetime.fromisoformat(value.replace('Z', '+00:00'))
                      assert parsed.astimezone(timezone.utc) <= anchor
              rating = ticket.get('satisfaction_rating') or {}
              for key in ('offered_at', 'rated_at'):
                  value = rating.get(key)
                  if value:
                      parsed = datetime.fromisoformat(value.replace('Z', '+00:00'))
                      assert parsed.astimezone(timezone.utc) <= anchor
          print(f'validated {len(tickets)} tickets ({path.stat().st_size} bytes)')
          PY

      - name: Commit fixture to the branch
        run: |
          if git diff --quiet -- data/tickets.json && git ls-files --error-unmatch data/tickets.json >/dev/null 2>&1; then
            echo 'Fixture already matches the generator.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tickets.json
          git commit -m 'Add August 2026 ticket fixture [skip ci]'
          git push origin HEAD:agent/infrastructure-ticket-ingestion-worker
