name: Analytics typecheck

on:
  pull_request:
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/analytics-typecheck.yml"
  push:
    branches:
      - refactor/analytics-use-case-repositories
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/analytics-typecheck.yml"

permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project
        run: python -m pip install -e . pytest
      - name: Install Pyright
        run: npm install --global pyright
      - name: Typecheck
        run: pyright src tests
      - name: Targeted tests
        run: pytest -q tests/application/use_cases/test_analytics_use_cases.py
